sonar.projectKey=iglesia-evento
sonar.projectName=Sistema de Eventos - Iglesia
sonar.projectVersion=1.0

# Carpetas de tu código que queremos analizar
sonar.sources=app, routes, resources/views, database
sonar.language=php
sonar.sourceEncoding=UTF-8

# Carpetas que SonarQube debe IGNORAR (librerías, caché, etc.)
sonar.exclusions=vendor/**, node_modules/**, storage/**, bootstrap/cache/**, public/**, tests/**, docker/**, *.md

# URL de tu SonarQube local
sonar.host.url=http://localhost:9000

sonar.login=${SONAR_TOKEN}